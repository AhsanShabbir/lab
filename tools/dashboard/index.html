<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WISE lab</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <h1>WISE lab</h1>
    </div>
    <input type="search" id="search" placeholder="Filter projects…" autocomplete="off">
    <button id="refreshBtn" type="button" title="Reload data">↻</button>
    <a class="link-muted" href="/recon.html">Recon toolkit</a>
    <span class="meta" id="labMeta"></span>
  </header>

  <main class="layout">
    <aside class="sidebar" id="projectList">
      <p class="empty">Loading projects…</p>
    </aside>

    <section class="detail" id="detailPane">
      <div class="placeholder">
        <h2>Select a project</h2>
        <p>Overview, findings, recon stats, scope, and notes appear here.</p>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
